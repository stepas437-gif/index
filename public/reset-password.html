<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CHUPEP - Сброс пароля</title>
    <link rel="stylesheet" href="/styles.css">
</head>
<body class="page-auth">
    <main class="auth-layout auth-layout-single">
        <section class="auth-card">
            <div class="auth-brand">
                <img class="auth-logo" src="/chupep-logo.jfif" alt="CHUPEP logo">
            </div>

            <span class="eyebrow">Сброс доступа</span>
            <h2 class="auth-title auth-title-compact">Задай новый пароль</h2>
            <p class="auth-note">Ссылка из письма действует 60 минут. После сохранения нового пароля все старые сессии будут завершены.</p>

            <form id="reset-password-form" class="stack">
                <div class="field">
                    <label for="reset-password">Новый пароль</label>
                    <input id="reset-password" name="password" type="password" minlength="6" required>
                </div>
                <div class="field">
                    <label for="reset-password-confirm">Повтори пароль</label>
                    <input id="reset-password-confirm" name="passwordConfirm" type="password" minlength="6" required>
                </div>
                <div class="auth-form-actions">
                    <button type="submit">Сохранить пароль</button>
                    <a class="button secondary" href="/login.html?mode=forgot-password">Запросить новую ссылку</a>
                </div>
            </form>

            <div id="reset-message" class="message"></div>
        </section>
    </main>
    <script src="/app.js"></script>
    <script>
        const form = document.getElementById('reset-password-form');
        const message = document.getElementById('reset-message');
        const submitButton = form.querySelector('button[type="submit"]');
        const params = new URLSearchParams(window.location.search);
        const token = String(params.get('token') || '').trim();

        if (!token) {
            submitButton.disabled = true;
            showMessage(message, 'error', 'Ссылка сброса неполная или недействительна.');
        }

        form.addEventListener('submit', async (event) => {
            event.preventDefault();
            hideMessage(message);

            if (!token) {
                showMessage(message, 'error', 'Ссылка сброса неполная или недействительна.');
                return;
            }

            const formData = new FormData(form);
            const password = String(formData.get('password') || '');
            const passwordConfirm = String(formData.get('passwordConfirm') || '');

            if (password.length < 6) {
                showMessage(message, 'error', 'Пароль должен быть не короче 6 символов.');
                return;
            }

            if (password !== passwordConfirm) {
                showMessage(message, 'error', 'Пароли не совпадают.');
                return;
            }

            submitButton.disabled = true;
            try {
                const payload = await apiFetch('/api/reset-password', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ token, password })
                });

                form.reset();
                showMessage(message, 'success', payload.message);
                setTimeout(() => {
                    window.location.href = '/login.html?passwordReset=1';
                }, 900);
            } catch (error) {
                showMessage(message, 'error', error.message);
            } finally {
                submitButton.disabled = false;
            }
        });
    </script>
</body>
</html>
